name: Deploy Frontend to Azure Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload files to $web container
        run: |
          az storage blob upload-batch \
            --account-name henriquecvresume \
            --destination '$web' \
            --source . \
            --overwrite \
            --auth-mode login

      - name: Purge Front Door cache
        run: |
          az afd endpoint purge \
            --resource-group rg-cloud-resume \
            --profile-name fd-henrique-resume \
            --endpoint-name henrique-resume \
            --content-paths '/*'
